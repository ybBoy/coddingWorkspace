server.port=8080

# 文件存储配置
data.dir=./data

# 邮件配置（测试时可以使用假的SMTP或者开启日志模式）
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=monitor@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 告警邮件配置
alert.email.enabled=true
alert.email.recipients=admin@example.com,operator@example.com

# 监控间隔（秒）
monitoring.interval.seconds=60

# 日志配置
logging.level.com.monitoring=DEBUG
logging.level.org.springframework=INFO
