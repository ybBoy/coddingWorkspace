<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影收藏清单</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🎬 电影收藏清单</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">总电影数</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">已看</span>
                    <span class="stat-value" id="statWatched">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">想看</span>
                    <span class="stat-value" id="statWant">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">搁置</span>
                    <span class="stat-value" id="statShelved">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">当前结果</span>
                    <span class="stat-value" id="statResult">0</span>
                </div>
            </div>
        </header>

        <section class="stats-section">
            <div class="stats-row">
                <div class="stats-card">
                    <h2 class="section-title">观影状态</h2>
                    <div id="statusStats" class="status-stats">
                        <div class="status-bars">
                            <div class="status-bar-item">
                                <div class="status-bar-label">
                                    <span class="dot watched"></span>已看
                                    <span class="status-num" id="barWatchedNum">0</span>
                                </div>
                                <div class="status-bar-track">
                                    <div class="status-bar-fill watched" id="barWatched" style="width:0%"></div>
                                </div>
                            </div>
                            <div class="status-bar-item">
                                <div class="status-bar-label">
                                    <span class="dot want"></span>想看
                                    <span class="status-num" id="barWantNum">0</span>
                                </div>
                                <div class="status-bar-track">
                                    <div class="status-bar-fill want" id="barWant" style="width:0%"></div>
                                </div>
                            </div>
                            <div class="status-bar-item">
                                <div class="status-bar-label">
                                    <span class="dot shelved"></span>搁置
                                    <span class="status-num" id="barShelvedNum">0</span>
                                </div>
                                <div class="status-bar-track">
                                    <div class="status-bar-fill shelved" id="barShelved" style="width:0%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="avg-rating">
                            <span class="avg-label">平均评分</span>
                            <span class="avg-value" id="avgRating">-</span>
                        </div>
                    </div>
                </div>
                <div class="stats-card">
                    <h2 class="section-title">类型统计</h2>
                    <div id="genreStats" class="genre-stats">
                        <span class="empty-hint-sm">暂无数据</span>
                    </div>
                </div>
                <div class="stats-card">
                    <h2 class="section-title">评分分布</h2>
                    <div id="ratingStats" class="rating-stats">
                        <span class="empty-hint-sm">暂无数据</span>
                    </div>
                </div>
                <div class="stats-card">
                    <h2 class="section-title">年度观影</h2>
                    <div id="yearStats" class="year-stats">
                        <span class="empty-hint-sm">暂无数据</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="tools-section">
            <div class="tools-row">
                <button type="button" class="btn-tool btn-random" onclick="getRandomMovie()">
                    🎲 随机推荐想看
                </button>
                <button type="button" class="btn-tool btn-export" onclick="exportMovies()">
                    📤 导出 JSON
                </button>
                <label class="btn-tool btn-import">
                    📥 导入 JSON
                    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importMovies(event)">
                </label>
                <div class="import-options" id="importOptions" style="display:none;">
                    <label>
                        <input type="radio" name="importMode" value="merge" checked> 合并到现有
                    </label>
                    <label>
                        <input type="radio" name="importMode" value="overwrite"> 覆盖现有
                    </label>
                    <button type="button" class="btn-tool" style="padding:6px 14px;font-size:0.85em;" onclick="executeImport()">
                        确认导入
                    </button>
                    <button type="button" class="btn-tool" style="padding:6px 14px;font-size:0.85em;background:transparent;border-color:#5a3a3a;color:#8b6b5b;" onclick="cancelImport()">
                        取消
                    </button>
                </div>
            </div>
        </section>

        <div id="randomModal" class="modal-overlay" style="display:none;">
            <div class="modal random-modal">
                <div class="modal-header">
                    <h3>🎲 为你推荐</h3>
                    <button class="modal-close" onclick="closeRandomModal()">&times;</button>
                </div>
                <div class="modal-body" id="randomMovieContent">
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeRandomModal()">关闭</button>
                    <button class="btn-primary" onclick="getRandomMovie()">再换一部</button>
                </div>
            </div>
        </div>

        <section class="add-form">
            <h2 class="section-title">新增电影</h2>
            <form id="movieForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="movieName">电影名 *</label>
                        <input type="text" id="movieName" required placeholder="例如：肖申克的救赎">
                    </div>
                    <div class="form-group">
                        <label for="movieDirector">导演</label>
                        <input type="text" id="movieDirector" placeholder="例如：弗兰克·德拉邦特">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="movieYear">年份</label>
                        <input type="number" id="movieYear" min="1900" max="2100" placeholder="例如：1994">
                    </div>
                    <div class="form-group">
                        <label for="movieGenre">类型</label>
                        <input type="text" id="movieGenre" placeholder="例如：剧情 / 犯罪">
                    </div>
                    <div class="form-group">
                        <label for="movieStatus">观看状态</label>
                        <select id="movieStatus">
                            <option value="想看">想看</option>
                            <option value="已看">已看</option>
                            <option value="搁置">搁置</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="movieRating">评分</label>
                        <select id="movieRating">
                            <option value="0">未评分</option>
                            <option value="1">⭐ 1星</option>
                            <option value="2">⭐⭐ 2星</option>
                            <option value="3">⭐⭐⭐ 3星</option>
                            <option value="4">⭐⭐⭐⭐ 4星</option>
                            <option value="5">⭐⭐⭐⭐⭐ 5星</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2; min-width: 280px;">
                        <label for="moviePoster">海报链接</label>
                        <input type="text" id="moviePoster" placeholder="https://example.com/poster.jpg（可选）">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex: 1.5; min-width: 240px;">
                        <label for="movieTags">标签</label>
                        <input type="text" id="movieTags" placeholder="用逗号分隔，如：经典,悬疑,必看">
                    </div>
                    <div class="form-group">
                        <label for="moviePriority">收藏优先级</label>
                        <select id="moviePriority">
                            <option value="0">普通</option>
                            <option value="1">⭐ 一星</option>
                            <option value="2">⭐⭐ 二星</option>
                            <option value="3">⭐⭐⭐ 三星</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="movieWatchDate">观看日期</label>
                        <input type="date" id="movieWatchDate">
                    </div>
                    <div class="form-group">
                        <label for="movieRewatchCount">重刷次数</label>
                        <input type="number" id="movieRewatchCount" min="0" value="0" placeholder="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="movieComment">短评</label>
                        <input type="text" id="movieComment" placeholder="写下你的一句话短评...">
                    </div>
                </div>
                <button type="submit" class="btn-primary">添加电影</button>
            </form>
        </section>

        <section class="filters">
            <h2 class="section-title">搜索 & 筛选 & 排序</h2>
            <div class="filter-row">
                <div class="form-group" style="flex: 2; min-width: 240px;">
                    <label for="searchInput">🔍 搜索（电影名/导演/短评）</label>
                    <input type="text" id="searchInput" placeholder="输入关键词搜索...">
                </div>
                <div class="form-group">
                    <label for="filterStatus">按状态</label>
                    <select id="filterStatus">
                        <option value="all">全部</option>
                        <option value="想看">想看</option>
                        <option value="已看">已看</option>
                        <option value="搁置">搁置</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterGenre">按类型</label>
                    <select id="filterGenre">
                        <option value="all">全部</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sortSelect">排序方式</label>
                    <select id="sortSelect">
                        <option value="default">默认排序</option>
                        <option value="recent">最近添加</option>
                        <option value="year_desc">年份（新→旧）</option>
                        <option value="year_asc">年份（旧→新）</option>
                        <option value="rating_desc">评分（高→低）</option>
                        <option value="name_asc">名称（A-Z）</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="movie-list-section">
            <div class="list-header">
                <h2 class="section-title">电影列表</h2>
                <div class="list-header-right">
                    <div class="view-switch">
                        <button type="button" class="btn-view active" id="btnCardView" onclick="switchView('card')">
                            卡片视图
                        </button>
                        <button type="button" class="btn-view" id="btnTableView" onclick="switchView('table')">
                            表格视图
                        </button>
                    </div>
                </div>
            </div>

            <div class="batch-toolbar" id="batchToolbar" style="display:none;">
                <label class="select-all">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
                    全选 <span id="selectedCount">0</span> 部已选中
                </label>
                <div class="batch-actions">
                    <select id="batchStatusSelect">
                        <option value="">批量修改状态...</option>
                        <option value="想看">改为 想看</option>
                        <option value="已看">改为 已看</option>
                        <option value="搁置">改为 搁置</option>
                    </select>
                    <button type="button" class="btn-tool btn-batch-status" onclick="batchUpdateStatus()">
                        应用
                    </button>
                    <button type="button" class="btn-tool btn-batch-delete" onclick="batchDelete()">
                        批量删除
                    </button>
                    <button type="button" class="btn-tool btn-cancel" onclick="clearSelection()">
                        取消选择
                    </button>
                </div>
            </div>

            <div id="movieList" class="movie-list">
                <p class="empty-hint">暂无电影，快来添加第一部吧！</p>
            </div>
            <div id="movieTable" class="movie-table-container" style="display:none;">
                <table class="movie-table">
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" id="tableSelectAll" onchange="toggleSelectAll(this)"></th>
                            <th>电影名</th>
                            <th>导演</th>
                            <th>年份</th>
                            <th>类型</th>
                            <th>状态</th>
                            <th>评分</th>
                            <th>标签</th>
                            <th>优先级</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>编辑电影</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editMovieId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editMovieName">电影名 *</label>
                        <input type="text" id="editMovieName" required>
                    </div>
                    <div class="form-group">
                        <label for="editMovieDirector">导演</label>
                        <input type="text" id="editMovieDirector">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editMovieYear">年份</label>
                        <input type="number" id="editMovieYear" min="1900" max="2100">
                    </div>
                    <div class="form-group">
                        <label for="editMovieGenre">类型</label>
                        <input type="text" id="editMovieGenre">
                    </div>
                    <div class="form-group">
                        <label for="editMovieStatus">观看状态</label>
                        <select id="editMovieStatus">
                            <option value="想看">想看</option>
                            <option value="已看">已看</option>
                            <option value="搁置">搁置</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editMovieRating">评分</label>
                        <select id="editMovieRating">
                            <option value="0">未评分</option>
                            <option value="1">⭐ 1星</option>
                            <option value="2">⭐⭐ 2星</option>
                            <option value="3">⭐⭐⭐ 3星</option>
                            <option value="4">⭐⭐⭐⭐ 4星</option>
                            <option value="5">⭐⭐⭐⭐⭐ 5星</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2; min-width: 240px;">
                        <label for="editMoviePoster">海报链接</label>
                        <input type="text" id="editMoviePoster">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex: 1.5;">
                        <label for="editMovieTags">标签</label>
                        <input type="text" id="editMovieTags" placeholder="用逗号分隔">
                    </div>
                    <div class="form-group">
                        <label for="editMoviePriority">收藏优先级</label>
                        <select id="editMoviePriority">
                            <option value="0">普通</option>
                            <option value="1">⭐ 一星</option>
                            <option value="2">⭐⭐ 二星</option>
                            <option value="3">⭐⭐⭐ 三星</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editMovieWatchDate">观看日期</label>
                        <input type="date" id="editMovieWatchDate">
                    </div>
                    <div class="form-group">
                        <label for="editMovieRewatchCount">重刷次数</label>
                        <input type="number" id="editMovieRewatchCount" min="0" value="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="editMovieComment">短评</label>
                        <input type="text" id="editMovieComment">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditModal()">取消</button>
                <button class="btn-primary" onclick="saveEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
