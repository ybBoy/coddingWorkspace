server.port=8080

# 文件存储配置
data.dir=./data

# 邮件配置（测试时可以使用假的SMTP或者开启日志模式）
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=monitor@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 告警邮件配置
alert.email.enabled=true
alert.email.recipients=admin@example.com,operator@example.com

# 监控间隔（秒）
monitoring.interval.seconds=60

# 日志配置
logging.level.com.monitoring=DEBUG
logging.level.org.springframework=INFO

# 钉钉机器人配置
dingtalk.webhook.enabled=true
dingtalk.webhook.url=https://oapi.dingtalk.com/robot/send?access_token=your_access_token_here
dingtalk.webhook.secret=

# 飞书机器人配置
feishu.webhook.enabled=true
feishu.webhook.url=https://open.feishu.cn/open-apis/bot/v2/hook/your_webhook_hook_id_here
