<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电动车中控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1f 100%);
            color: #fff;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            height: calc(100vh - 30px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .left-panel {
            grid-row: span 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cluster-panel {
            background: linear-gradient(145deg, rgba(20, 20, 50, 0.9), rgba(10, 10, 30, 0.95));
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cluster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: center;
        }

        .gauge {
            text-align: center;
        }

        .gauge-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .gauge-value {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(180deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .gauge-unit {
            font-size: 1rem;
            color: #888;
            margin-top: 5px;
        }

        .gauge-value.speed {
            background: linear-gradient(180deg, #00d4ff, #0088aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gauge-value.battery {
            background: linear-gradient(180deg, #00ff88, #00aa55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gauge-value.range {
            background: linear-gradient(180deg, #ff6b9d, #cc5580);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .battery-bar-container {
            margin-top: 15px;
            padding: 0 20px;
        }

        .battery-bar-bg {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .battery-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .battery-bar-fill.low {
            background: linear-gradient(90deg, #ff6b6b, #cc5555);
        }

        .battery-bar-fill.charging {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-badge.active {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        .status-badge.charging {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .status-dot.active {
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
        }

        .status-dot.charging {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .drive-controls {
            background: linear-gradient(145deg, rgba(20, 20, 50, 0.9), rgba(10, 10, 30, 0.95));
            border-radius: 15px;
            padding: 15px 20px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .drive-controls h3 {
            color: #00d4ff;
            margin-bottom: 12px;
            font-size: 1rem;
            text-align: center;
        }

        .drive-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .drive-btn {
            flex: 1;
            max-width: 200px;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-accelerate {
            background: linear-gradient(135deg, #00d4ff, #0088aa);
            color: #fff;
        }

        .btn-accelerate:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-accelerate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-brake {
            background: linear-gradient(135deg, #ff6b6b, #cc5555);
            color: #fff;
        }

        .btn-brake:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .temp-panel {
            background: linear-gradient(145deg, rgba(20, 20, 50, 0.9), rgba(10, 10, 30, 0.95));
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(123, 44, 191, 0.2);
            flex: 1;
        }

        .temp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .temp-header h3 {
            color: #7b2cbf;
            font-size: 1rem;
        }

        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 3px;
        }

        .mode-btn {
            padding: 5px 12px;
            border: none;
            background: transparent;
            color: #888;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: rgba(123, 44, 191, 0.5);
            color: #fff;
        }

        .temp-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .temp-item {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .temp-item-label {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 5px;
        }

        .temp-item-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .temp-item-value.interior {
            color: #ff6b9d;
        }

        .temp-item-value.target {
            color: #7b2cbf;
        }

        .temp-item-value.exterior {
            color: #00d4ff;
        }

        .temp-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .temp-slider-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .temp-slider-label {
            font-size: 0.8rem;
            color: #888;
            min-width: 50px;
        }

        .temp-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .temp-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .temp-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.5);
        }

        .temp-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .temp-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .temp-btn-down {
            background: linear-gradient(135deg, #00d4ff, #0088aa);
            color: #fff;
        }

        .temp-btn-up {
            background: linear-gradient(135deg, #ff6b6b, #cc5555);
            color: #fff;
        }

        .temp-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .charge-panel {
            background: linear-gradient(145deg, rgba(20, 20, 50, 0.9), rgba(10, 10, 30, 0.95));
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            flex: 1;
        }

        .charge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .charge-header h3 {
            color: #00ff88;
            font-size: 1rem;
        }

        .charge-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .charge-status-text {
            color: #888;
        }

        .charge-status-text.active {
            color: #00ff88;
        }

        .charge-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .charge-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .charge-btn.start {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #fff;
        }

        .charge-btn.stop {
            background: linear-gradient(135deg, #ff6b6b, #cc5555);
            color: #fff;
        }

        .charge-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .charge-info {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #888;
        }

        .charge-info p {
            margin-bottom: 5px;
        }

        .charge-info p:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .left-panel {
                grid-row: auto;
            }

            .gauge-value {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 600px) {
            .cluster-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .status-row {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }

            .drive-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🚗 电动车智能中控系统</h1>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="cluster-panel">
                    <div class="cluster-grid">
                        <div class="gauge">
                            <div class="gauge-label">当前车速</div>
                            <div class="gauge-value speed" id="speed">0</div>
                            <div class="gauge-unit">km/h</div>
                        </div>

                        <div class="gauge">
                            <div class="gauge-label">剩余电量</div>
                            <div class="gauge-value battery" id="battery">100</div>
                            <div class="gauge-unit">%</div>
                        </div>

                        <div class="gauge">
                            <div class="gauge-label">剩余续航</div>
                            <div class="gauge-value range" id="range">85</div>
                            <div class="gauge-unit">km</div>
                        </div>
                    </div>

                    <div class="battery-bar-container">
                        <div class="battery-bar-bg">
                            <div class="battery-bar-fill" id="batteryFill" style="width: 100%;"></div>
                        </div>
                    </div>

                    <div class="status-row">
                        <div class="status-badge" id="acBadge">
                            <div class="status-dot" id="acDot"></div>
                            <span id="acText">空调关闭</span>
                        </div>
                        <div class="status-badge" id="chargeBadge">
                            <div class="status-dot" id="chargeDot"></div>
                            <span id="chargeText">未充电</span>
                        </div>
                    </div>
                </div>

                <div class="drive-controls">
                    <h3>⚡ 驾驶控制</h3>
                    <div class="drive-buttons">
                        <button class="drive-btn btn-accelerate" id="accelerateBtn" onclick="accelerate()">
                            🚀 踩油门加速 (+10)
                        </button>
                        <button class="drive-btn btn-brake" onclick="brake()">
                            🛑 踩刹车减速 (-10)
                        </button>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="temp-panel">
                    <div class="temp-header">
                        <h3>🌡️ 温度控制</h3>
                        <div class="mode-toggle">
                            <button class="mode-btn active" id="autoModeBtn" onclick="setTempMode('auto')">自动</button>
                            <button class="mode-btn" id="manualModeBtn" onclick="setTempMode('manual')">手动</button>
                        </div>
                    </div>

                    <div class="temp-display">
                        <div class="temp-item">
                            <div class="temp-item-label">车内温度</div>
                            <div class="temp-item-value interior" id="interiorTemp">22.0</div>
                            <div class="gauge-unit">°C</div>
                        </div>
                        <div class="temp-item">
                            <div class="temp-item-label">车外温度</div>
                            <div class="temp-item-value exterior" id="exteriorTemp">25.0</div>
                            <div class="gauge-unit">°C</div>
                        </div>
                    </div>

                    <div class="temp-controls">
                        <div class="temp-slider-section">
                            <span class="temp-slider-label">目标</span>
                            <input type="range" class="temp-slider" id="targetTempSlider" min="16" max="30" step="0.5" value="22" onchange="setTargetTemp(this.value)">
                            <span class="temp-item-value target" id="targetTemp">22.0</span>
                            <span class="gauge-unit">°C</span>
                        </div>

                        <div class="temp-buttons">
                            <button class="temp-btn temp-btn-down" onclick="adjustTemp(-1)">❄️</button>
                            <button class="temp-btn temp-btn-up" onclick="adjustTemp(1)">🔥</button>
                        </div>
                    </div>
                </div>

                <div class="charge-panel">
                    <div class="charge-header">
                        <h3>🔋 充电控制</h3>
                        <div class="charge-status">
                            <span class="charge-status-text" id="chargeStatusText">未充电</span>
                        </div>
                    </div>

                    <div class="charge-buttons">
                        <button class="charge-btn start" id="chargeBtn" onclick="toggleCharging()">
                            ⚡ 开始充电
                        </button>
                    </div>

                    <div class="charge-info">
                        <p>💡 提示：充电时车辆必须静止</p>
                        <p>💡 充电时可正常使用空调</p>
                        <p>💡 充满电后自动停止充电</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentStatus = null;

        async function getStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                currentStatus = data;
                updateUI(data);
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }

        function updateUI(status) {
            document.getElementById('speed').textContent = status.speed.toFixed(1);
            document.getElementById('battery').textContent = status.batteryLevel.toFixed(1);
            document.getElementById('range').textContent = status.range.toFixed(1);

            const batteryFill = document.getElementById('batteryFill');
            const batteryPercent = status.batteryLevel;
            batteryFill.style.width = `${batteryPercent}%`;
            
            const isCharging = status.charging === true;
            
            batteryFill.classList.remove('low', 'charging');
            if (batteryPercent < 20) {
                batteryFill.classList.add('low');
            }
            if (isCharging) {
                batteryFill.classList.add('charging');
            }

            updateAcStatus(status.acOn);
            updateChargingStatus(isCharging);
            
            if (status.interiorTemp !== undefined) {
                updateTempUI(status);
            }

            const accelerateBtn = document.getElementById('accelerateBtn');
            accelerateBtn.disabled = isCharging;
        }

        function updateAcStatus(acOn) {
            const acDot = document.getElementById('acDot');
            const acText = document.getElementById('acText');
            const acBadge = document.getElementById('acBadge');

            if (acOn) {
                acDot.classList.add('active');
                acText.textContent = '❄️ 空调开启';
                acBadge.classList.add('active');
            } else {
                acDot.classList.remove('active');
                acText.textContent = '空调关闭';
                acBadge.classList.remove('active');
            }
        }

        function updateChargingStatus(charging) {
            const chargeDot = document.getElementById('chargeDot');
            const chargeText = document.getElementById('chargeText');
            const chargeBadge = document.getElementById('chargeBadge');
            const chargeBtn = document.getElementById('chargeBtn');
            const chargeStatusText = document.getElementById('chargeStatusText');

            if (charging) {
                chargeDot.classList.add('active', 'charging');
                chargeText.textContent = '⚡ 充电中...';
                chargeBadge.classList.add('charging');
                chargeBtn.textContent = '⏹️ 停止充电';
                chargeBtn.classList.remove('start');
                chargeBtn.classList.add('stop');
                chargeStatusText.textContent = '充电中';
                chargeStatusText.classList.add('active');
            } else {
                chargeDot.classList.remove('active', 'charging');
                chargeText.textContent = '未充电';
                chargeBadge.classList.remove('charging');
                chargeBtn.textContent = '⚡ 开始充电';
                chargeBtn.classList.remove('stop');
                chargeBtn.classList.add('start');
                chargeStatusText.textContent = '未充电';
                chargeStatusText.classList.remove('active');
            }
        }

        function updateTempUI(status) {
            document.getElementById('interiorTemp').textContent = status.interiorTemp.toFixed(1);
            document.getElementById('exteriorTemp').textContent = status.exteriorTemp.toFixed(1);
            document.getElementById('targetTemp').textContent = status.targetTemp.toFixed(1);
            
            const slider = document.getElementById('targetTempSlider');
            if (slider.value != status.targetTemp) {
                slider.value = status.targetTemp;
            }

            const autoModeBtn = document.getElementById('autoModeBtn');
            const manualModeBtn = document.getElementById('manualModeBtn');
            
            if (status.tempControlMode === 'auto') {
                autoModeBtn.classList.add('active');
                manualModeBtn.classList.remove('active');
            } else {
                autoModeBtn.classList.remove('active');
                manualModeBtn.classList.add('active');
            }
        }

        async function accelerate() {
            if (currentStatus && currentStatus.charging) {
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/accelerate?amount=10`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('加速失败:', error);
            }
        }

        async function brake() {
            try {
                const response = await fetch(`${API_BASE}/brake?amount=10`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('减速失败:', error);
            }
        }

        async function toggleCharging() {
            try {
                const response = await fetch(`${API_BASE}/toggle-charging`, {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.status) {
                    updateUI(result.status);
                }
            } catch (error) {
                console.error('切换充电状态失败:', error);
            }
        }

        async function setTempMode(mode) {
            try {
                const response = await fetch(`${API_BASE}/set-temp-mode?mode=${mode}`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('设置温度模式失败:', error);
            }
        }

        async function setTargetTemp(temp) {
            try {
                const response = await fetch(`${API_BASE}/set-target-temp?temp=${temp}`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('设置目标温度失败:', error);
            }
        }

        async function adjustTemp(delta) {
            try {
                const endpoint = delta > 0 ? 'adjust-temp-up' : 'adjust-temp-down';
                const response = await fetch(`${API_BASE}/${endpoint}`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('调节温度失败:', error);
            }
        }

        document.addEventListener('click', async function(e) {
            const acBadge = e.target.closest('#acBadge');
            if (acBadge) {
                try {
                    const response = await fetch(`${API_BASE}/toggle-ac`, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    updateUI(data);
                } catch (error) {
                    console.error('切换空调失败:', error);
                }
            }
        });

        getStatus();
        setInterval(getStatus, 1000);
    </script>
</body>
</html>
