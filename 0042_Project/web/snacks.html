<!--
  文件职责：
    零食库存小柜子的前端 HTML 页面结构。
    包含页面顶部（标题+统计+筛选）、新增零食表单、以及零食卡片列表容器。

  数据流中的位置：
    浏览器加载 snacks.html → 加载 snacks.css 和 snacks.js
    snacks.js 通过 fetch 调用后端 /api/snacks 接口获取数据 → 渲染到本页面的 DOM 节点
    用户点击操作按钮 → snacks.js 调用后端 API → 成功后刷新本页面内容
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零食库存小柜子</title>
  <link rel="stylesheet" href="snacks.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-top">
        <h1 class="title">🍪 零食库存小柜子</h1>
        <div class="stats">
          <span class="stat total" id="stat-total">共 0 种</span>
          <span class="stat attention" id="stat-attention">⚠ 需处理 0</span>
        </div>
      </div>

      <div class="header-bar">
        <div class="filter">
          <label for="location-filter">存放位置：</label>
          <select id="location-filter">
            <option value="all">全部位置</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btn-add">+ 新增零食</button>
      </div>
    </header>

    <form class="add-form hidden" id="add-form">
      <div class="form-row">
        <label>名称 <span class="required">*</span></label>
        <input type="text" id="input-name" placeholder="比如：乐事薯片" required>
      </div>
      <div class="form-row">
        <label>口味</label>
        <input type="text" id="input-flavor" placeholder="比如：黄瓜味">
      </div>
      <div class="form-row">
        <label>数量</label>
        <input type="number" id="input-quantity" value="1" min="0" step="1">
      </div>
      <div class="form-row">
        <label>存放位置</label>
        <input type="text" id="input-location" placeholder="比如：客厅柜子第二层">
      </div>
      <div class="form-row">
        <label>保质期</label>
        <input type="date" id="input-expiry">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">确认添加</button>
        <button type="button" class="btn btn-default" id="btn-cancel-add">取消</button>
      </div>
    </form>

    <main class="shelf">
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon">🧺</div>
        <p>柜子还是空的，先加点零食吧</p>
      </div>
      <div class="snack-grid" id="snack-grid"></div>
    </main>
  </div>

  <script src="snacks.js"></script>
</body>
</html>
