<!--
  文件职责：
    零食库存小柜子的前端 HTML 页面结构。
    包含顶部（标题+统计+筛选+搜索+排序+导入导出+设置）、新增/编辑表单、
    设置弹窗、零食卡片列表（支持批量勾选）、批量操作栏、以及操作记录流水区域。

  数据流中的位置：
    浏览器加载 snacks.html → 加载 snacks.css 和 snacks.js
    snacks.js 通过 fetch 调用后端 /api/* 接口获取数据 → 渲染到本页面的 DOM 节点
    用户点击操作按钮 → snacks.js 调用后端 API → 成功后刷新本页面内容
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零食库存小柜子</title>
  <link rel="stylesheet" href="snacks.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-top">
        <h1 class="title">🍪 零食库存小柜子</h1>
        <div class="stats">
          <span class="stat total" id="stat-total">共 0 种</span>
          <span class="stat low" id="stat-low">📦 低库存 0</span>
          <span class="stat soon" id="stat-soon">⏰ 临期 0</span>
          <span class="stat expired" id="stat-expired">❌ 已过期 0</span>
          <span class="stat target" id="stat-target">🎯 低于目标 0</span>
        </div>
      </div>

      <div class="header-bar">
        <div class="filters">
          <div class="filter search-filter">
            <input type="text" id="search-input" placeholder="🔍 搜索名称 / 口味 / 分类...">
          </div>
          <div class="filter">
            <label for="location-filter">位置：</label>
            <select id="location-filter">
              <option value="all">全部位置</option>
            </select>
          </div>
          <div class="filter">
            <label for="category-filter">分类：</label>
            <select id="category-filter">
              <option value="all">全部分类</option>
            </select>
          </div>
          <div class="filter">
            <label for="sort-select">排序：</label>
            <select id="sort-select">
              <option value="">默认顺序</option>
              <option value="name_asc">名称 ↑</option>
              <option value="name_desc">名称 ↓</option>
              <option value="quantity_asc">数量 ↑</option>
              <option value="quantity_desc">数量 ↓</option>
              <option value="expiry_date_asc">保质期 ↑（近→远）</option>
              <option value="expiry_date_desc">保质期 ↓（远→近）</option>
            </select>
          </div>
          <button class="btn btn-warn" id="btn-only-attention">只看需要处理</button>
        </div>
        <div class="header-actions">
          <button class="btn btn-default" id="btn-settings">⚙️ 设置</button>
          <button class="btn btn-default" id="btn-export-json">导出 JSON</button>
          <button class="btn btn-default" id="btn-export-csv">导出 CSV</button>
          <label class="btn btn-default import-btn">
            导入 JSON
            <input type="file" id="input-import" accept=".json" hidden>
          </label>
          <button class="btn btn-primary" id="btn-add">+ 新增零食</button>
        </div>
      </div>

      <!-- 批量操作栏 -->
      <div class="batch-bar hidden" id="batch-bar">
        <span class="batch-info">已选择 <strong id="batch-count">0</strong> 项</span>
        <div class="batch-actions">
          <button class="btn btn-primary btn-sm" id="btn-batch-restock">批量补货</button>
          <button class="btn btn-warn btn-sm" id="btn-batch-disable">批量停用</button>
          <button class="btn btn-danger btn-sm" id="btn-batch-delete">批量删除</button>
          <button class="btn btn-default btn-sm" id="btn-batch-clear">取消选择</button>
        </div>
      </div>
    </header>

    <!-- 新增/编辑表单弹窗 -->
    <div class="modal-mask hidden" id="form-mask"></div>
    <div class="modal hidden" id="form-modal">
      <div class="modal-title" id="form-title">新增零食</div>
      <form class="modal-form" id="snack-form">
        <input type="hidden" id="input-id">
        <div class="form-row">
          <label>名称 <span class="required">*</span></label>
          <input type="text" id="input-name" placeholder="比如：乐事薯片" required>
        </div>
        <div class="form-row">
          <label>口味</label>
          <input type="text" id="input-flavor" placeholder="比如：黄瓜味">
        </div>
        <div class="form-row">
          <label>分类</label>
          <input type="text" id="input-category" placeholder="比如：饮料、饼干、糖果">
        </div>
        <div class="form-row two-col">
          <div>
            <label>当前数量</label>
            <input type="number" id="input-quantity" value="1" min="0" step="1">
          </div>
          <div>
            <label>目标库存</label>
            <input type="number" id="input-target" value="0" min="0" step="1" placeholder="0=不设置">
          </div>
        </div>
        <div class="form-row">
          <label>存放位置</label>
          <input type="text" id="input-location" placeholder="比如：客厅柜子第二层">
        </div>
        <div class="form-row">
          <label>保质期</label>
          <input type="date" id="input-expiry">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-submit">确认</button>
          <button type="button" class="btn btn-default" id="btn-cancel">取消</button>
        </div>
      </form>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-mask hidden" id="settings-mask"></div>
    <div class="modal modal-sm hidden" id="settings-modal">
      <div class="modal-title">⚙️ 设置</div>
      <div class="modal-form">
        <div class="form-row">
          <label>临期天数阈值</label>
          <select id="setting-expiring-days">
            <option value="3">3 天</option>
            <option value="7">7 天（默认）</option>
            <option value="14">14 天</option>
            <option value="30">30 天</option>
          </select>
          <div class="form-hint">零食保质期少于这个天数时会被标记为「临期」</div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="btn-save-settings">保存设置</button>
          <button class="btn btn-default" id="btn-close-settings">关闭</button>
        </div>
      </div>
    </div>

    <!-- 主体区域：左侧卡片 + 右侧操作记录 -->
    <div class="main-layout">
      <section class="shelf">
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-icon">🧺</div>
          <p>柜子还是空的，先加点零食吧</p>
        </div>
        <div class="snack-grid" id="snack-grid"></div>
      </section>

      <aside class="log-panel">
        <div class="log-header">
          <h3>📋 最近操作</h3>
          <button class="btn-text" id="btn-refresh-logs">刷新</button>
        </div>
        <div class="log-list" id="log-list">
          <div class="log-empty">暂无操作记录</div>
        </div>
      </aside>
    </div>
  </div>

  <script src="snacks.js"></script>
</body>
</html>
