<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>露营装备清单</title>
    <link rel="stylesheet" href="camping.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>🏕️ 露营装备清单</h1>
            <p class="subtitle">出发前，再检查一遍</p>
        </header>

        <section class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="total-weight">0</span>
                <span class="stat-label">总重量 (kg)</span>
            </div>
            <div class="stat-item stat-packed">
                <span class="stat-value" id="packed-count">0</span>
                <span class="stat-label">已打包</span>
            </div>
            <div class="stat-item stat-alert">
                <span class="stat-value" id="unpacked-essential">0</span>
                <span class="stat-label">未打包必带</span>
            </div>
        </section>

        <section class="filter-bar">
            <label for="category-filter">按类别筛选：</label>
            <select id="category-filter">
                <option value="全部">全部</option>
            </select>
        </section>

        <section class="add-form">
            <h2>新增装备</h2>
            <form id="gear-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="gear-name">装备名称 *</label>
                        <input type="text" id="gear-name" required placeholder="例如：帐篷">
                    </div>
                    <div class="form-group">
                        <label for="gear-category">类别</label>
                        <input type="text" id="gear-category" placeholder="例如：住宿" list="category-list">
                        <datalist id="category-list"></datalist>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="gear-weight">重量 (kg)</label>
                        <input type="number" id="gear-weight" step="0.1" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="gear-essential">必带</label>
                        <input type="checkbox" id="gear-essential">
                    </div>
                    <div class="form-group flex-grow">
                        <label for="gear-notes">备注</label>
                        <input type="text" id="gear-notes" placeholder="备注信息">
                    </div>
                </div>
                <button type="submit" class="btn-add">添加装备</button>
            </form>
        </section>

        <section class="gear-list" id="gear-list">
        </section>
    </div>

    <script src="camping.js"></script>
</body>
</html>
