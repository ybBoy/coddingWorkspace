<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电动车中控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .status-card h3 {
            font-size: 1rem;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 3rem;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .unit {
            font-size: 1rem;
            color: #888;
            margin-left: 5px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .control-group h4 {
            text-align: center;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .btn {
            width: 100%;
            padding: 15px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn-accelerate {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }

        .btn-accelerate:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-brake {
            background: linear-gradient(135deg, #ff6b6b, #cc5555);
            color: #fff;
        }

        .btn-brake:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-ac {
            background: linear-gradient(135deg, #7b2cbf, #5a1a9c);
            color: #fff;
        }

        .btn-ac:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(123, 44, 191, 0.4);
        }

        .btn-ac.active {
            background: linear-gradient(135deg, #ff8c00, #cc6600);
        }

        .ac-indicator {
            margin-top: 15px;
            text-align: center;
        }

        .ac-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            background: rgba(123, 44, 191, 0.2);
            color: #999;
            transition: all 0.3s ease;
        }

        .ac-status.on {
            background: rgba(255, 140, 0, 0.2);
            color: #ff8c00;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
        }

        .battery-bar {
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .battery-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .battery-fill.low {
            background: linear-gradient(90deg, #ff6b6b, #cc5555);
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .info-panel h4 {
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .value {
                font-size: 2.5rem;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🚗 电动车中控系统</h1>
            <p style="color: #888;">实时监控车辆状态</p>
        </div>

        <div class="status-grid">
            <div class="status-card">
                <h3>当前车速</h3>
                <div class="value" id="speed">0</div>
                <div class="unit">km/h</div>
            </div>

            <div class="status-card">
                <h3>剩余电量</h3>
                <div class="value" id="battery">100</div>
                <div class="unit">%</div>
                <div class="battery-bar">
                    <div class="battery-fill" id="batteryFill" style="width: 100%;"></div>
                </div>
            </div>

            <div class="status-card">
                <h3>剩余续航</h3>
                <div class="value" id="range">85</div>
                <div class="unit">km</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h4>⚡ 驾驶控制</h4>
                <button class="btn btn-accelerate" onclick="accelerate()">
                    🚀 踩油门加速 (+10)
                </button>
                <button class="btn btn-brake" onclick="brake()">
                    🛑 踩刹车减速 (-10)
                </button>
            </div>

            <div class="control-group">
                <h4>❄️ 空调控制</h4>
                <button class="btn btn-ac" id="acBtn" onclick="toggleAc()">
                    🎚️ 空调开关
                </button>
                <div class="ac-indicator">
                    <span class="ac-status" id="acStatus">空调关闭</span>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <h4>📋 系统说明</h4>
            <ul class="info-list">
                <li>• 车速范围：0 - 180 km/h</li>
                <li>• 剩余续航计算：电量 × 0.85</li>
                <li>• 开启空调后，续航减少 10 km</li>
                <li>• 系统每 3 秒自动模拟电量变化</li>
                <li>• 车速越快、空调开启时，电量消耗更快</li>
            </ul>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function getStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }

        function updateUI(status) {
            document.getElementById('speed').textContent = status.speed.toFixed(1);
            document.getElementById('battery').textContent = status.batteryLevel.toFixed(1);
            document.getElementById('range').textContent = status.range.toFixed(1);

            const batteryFill = document.getElementById('batteryFill');
            const batteryPercent = status.batteryLevel;
            batteryFill.style.width = `${batteryPercent}%`;
            if (batteryPercent < 20) {
                batteryFill.classList.add('low');
            } else {
                batteryFill.classList.remove('low');
            }

            const acBtn = document.getElementById('acBtn');
            const acStatus = document.getElementById('acStatus');
            if (status.acOn) {
                acBtn.classList.add('active');
                acStatus.classList.add('on');
                acStatus.textContent = '❄️ 空调开启';
            } else {
                acBtn.classList.remove('active');
                acStatus.classList.remove('on');
                acStatus.textContent = '空调关闭';
            }
        }

        async function accelerate() {
            try {
                const response = await fetch(`${API_BASE}/accelerate?amount=10`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('加速失败:', error);
            }
        }

        async function brake() {
            try {
                const response = await fetch(`${API_BASE}/brake?amount=10`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('减速失败:', error);
            }
        }

        async function toggleAc() {
            try {
                const response = await fetch(`${API_BASE}/toggle-ac`, {
                    method: 'POST'
                });
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('切换空调失败:', error);
            }
        }

        getStatus();
        setInterval(getStatus, 1000);
    </script>
</body>
</html>
